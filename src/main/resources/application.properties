spring.application.name=bloomix-admin-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

spring.session.timeout=2h
spring.session.data.redis.namespace=bloomix:admin:session

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health,info

spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=100

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

kopis.base-url=http://www.kopis.or.kr/openApi/restful
kopis.service-key=${KOPIS_API_KEY:}
kopis.connect-timeout=5s
kopis.read-timeout=10s

culture-info.base-url=https://apis.data.go.kr/B553457/cultureinfo
culture-info.place-base-url=https://apis.data.go.kr/B553457/nopenapi/rest/cultureartspaces
culture-info.service-key=${CULTURE_INFO_API_KEY:}
culture-info.connect-timeout=5s
culture-info.read-timeout=10s

holiday.base-url=https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
holiday.service-key=${HOLIDAY_API_KEY:}
holiday.connect-timeout=5s
holiday.read-timeout=10s

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
